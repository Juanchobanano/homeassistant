# Frigate NVR configuration
# Docs: https://docs.frigate.video/

mqtt:
  host: mosquitto
  port: 1883
  user: ""
  password: ""

# ── Detectors ─────────────────────────────────────────────────────

detectors:
  # CPU detector — works everywhere, no extra hardware needed.
  # Remove this once you configure a hardware accelerator below.
  cpu_detector:
    type: cpu
    num_threads: 3

  # Google Coral USB TPU — uncomment if you have one plugged in:
  # coral:
  #   type: edgetpu
  #   device: usb

  # Google Coral PCIe TPU:
  # coral_pcie:
  #   type: edgetpu
  #   device: pci

  # Intel iGPU (VAAPI) — uncomment if your server has an Intel CPU:
  #   and add the following ffmpeg preset under the camera:
  #   hwaccel_args: preset-vaapi
  #
  # openvino:
  #   type: openvino
  #   device: GPU

# ── Database ───────────────────────────────────────────────────────

database:
  path: /config/frigate.db

# ── Recording & Snapshots ──────────────────────────────────────────

record:
  enabled: true
  retain:
    days: 7
    mode: motion
  events:
    retain:
      default: 30
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 30

# ── FFmpeg defaults ────────────────────────────────────────────────

ffmpeg:
  # Remove or change this if you add a hardware detector above.
  # hwaccel_args: preset-vaapi

# ── UI ─────────────────────────────────────────────────────────────

ui:
  live_mode: webrtc

# ── Cameras ────────────────────────────────────────────────────────
#
# Tip: use the sub-stream (low res) for detect, main stream for record.
# This dramatically reduces CPU usage.
#
# Example:
#
# cameras:
#   front_door:
#     ffmpeg:
#       inputs:
#         - path: rtsp://user:password@192.168.2.100:554/Streaming/Channels/102
#           roles:
#             - detect
#         - path: rtsp://user:password@192.168.2.100:554/Streaming/Channels/101
#           roles:
#             - record
#     detect:
#       width: 640
#       height: 480
#       fps: 5
#     record:
#       enabled: true
#       retain:
#         days: 7
#         mode: motion
#     snapshots:
#       enabled: true
#     objects:
#       track:
#         - person
#         - car
#         - cat
#         - dog

cameras: {}
